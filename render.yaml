services:
  - type: web
    name: deepfake-api
    runtime: python-3.12
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://deep-fake.dev,https://www.deep-fake.dev,https://deepfake-detection-ovj5.onrender.com
      - key: FRONTEND_URL
        value: https://deep-fake.dev

